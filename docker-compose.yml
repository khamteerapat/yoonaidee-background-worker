services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yoonaidee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yoonaidee"]
      interval: 3s
      retries: 15
  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/yoonaidee
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_MIGRATE: 'true'
      RESEARCH_ENABLED: 'false'
      AI_CHAT_PROVIDER: none
